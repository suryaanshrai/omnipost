# OmniPost: UI, API, workers, scheduler, Postgres, Redis.
#
# Pin a build with IMAGE_TAG=<git-sha> (API images) and UI_IMAGE_TAG=<git-sha>
# in .env to roll back; every image is also pushed tagged with its commit SHA.

x-api-image: &api-image suryaanshrai515/omnipost-api:${IMAGE_TAG:-latest}

# Docker's default json-file logging never rotates; on a small VPS the disk
# fills up. 3 x 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  # Behind a TLS proxy (see DEPLOY.md) leave this on. Set "false" only for a
  # plain-HTTP local run, or every request is redirected to https://.
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  # Wraps every encrypted channel credential and BYOK provider key — see
  # omnipost_api/crypto.py. Generate with: openssl rand -base64 32
  OMNIPOST_KEK: ${OMNIPOST_KEK:?set OMNIPOST_KEK in .env (openssl rand -base64 32)}
  PYTHONPATH: /app
  DB_NAME: omni-db
  DB_USER: root
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  # Where links in emails (password reset, verification) point.
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  ACCOUNT_EMAIL_VERIFICATION: ${ACCOUNT_EMAIL_VERIFICATION:-optional}
  AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Platform apps run by this deployment (LinkedIn and X use each
  # workspace's own app instead). Blank = that platform can't be connected.
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  THREADS_APP_ID: ${THREADS_APP_ID:-}
  THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
  TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
  TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
  YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
  YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  # GET /metrics is off in production until this is set.
  METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
  ENABLE_ADMIN: ${ENABLE_ADMIN:-true}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
  MIGRATE_ON_START: "false"

x-api-service: &api-service
  image: *api-image
  environment: &api-service-env
    <<: *api-env
  networks: [omni-net]
  restart: unless-stopped
  logging: *logging
  volumes:
    - media-data:/app/mediafiles
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  # Runs migrations once, then exits. Everything API-side waits for it.
  migrate:
    image: *api-image
    environment:
      <<: *api-env
      OMNIPOST_ROLE: migrate
    networks: [omni-net]
    logging: *logging
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-service
    environment:
      <<: *api-service-env
      OMNIPOST_ROLE: web
    # Bound to localhost: the TLS proxy (DEPLOY.md) is the only way in.
    # Docker's published ports bypass ufw, so 0.0.0.0 would expose plain HTTP.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Publishing (time-sensitive) and media/metrics/AI run in separate workers
  # so a video transcode never delays a scheduled post.
  worker:
    <<: *api-service
    environment:
      <<: *api-service-env
      OMNIPOST_ROLE: worker-publish

  worker-media:
    <<: *api-service
    environment:
      <<: *api-service-env
      OMNIPOST_ROLE: worker-media

  # Reconciler, recurrence, token refresh and metrics polling, in one process.
  scheduler:
    <<: *api-service
    environment:
      <<: *api-service-env
      OMNIPOST_ROLE: scheduler
    volumes: []

  ui:
    image: suryaanshrai515/omnipost-ui:${UI_IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    networks: [omni-net]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published to the host. Shell: `docker compose exec db psql -U root omni-db`.
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: omni-db
    networks: [omni-net]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d omni-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly: scheduled jobs survive a Redis restart (Postgres is still
    # the source of truth; the reconciler re-queues anything lost).
    # noeviction: Redis must never silently drop queued jobs under memory
    # pressure.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    environment:
      # redis-cli reads the password from here, so it's not on the command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [omni-net]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  omni-net:
    name: omni-net

volumes:
  db-data:
  media-data:
  redis-data:
